<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>もっと思い出を振り返る | happy wedding</title>
<meta name="description" content="みんなから集まった思い出の写真を、空間に散らばった写真の中から眺めたり、カテゴリーごとに整理して見たりできるページです。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/memory-list.css">
</head>
<body class="memlist-body">
<!-- ==========================================================
  MEMORY下層ページ（本人の構想をそのまま実装）
   1. トップページMEMORYの最後にある「もっと思い出を振り返る」を押す
   2. トップページの写真が流れる空間へズームインしながらこのページへ
   3. 写真が空間に散らばっている（上下のフィルム帯は無し・背景色は踏襲）
   4. 下の整理タブを押すと、そのカテゴリーの写真が散らばった位置から
      中央へ飛んできて1枚ずつのカルーセルに整理される
   5. 整理された画面でもタブでカテゴリーを切り替えられる
   6. 枠外か「閉じる」を押すと空間に戻る
   7. 「MEMORYに戻る」でズームアウトしてトップページのMEMORYへ
  動きの仕組みはassets/js/memory-list.js、見た目はassets/css/memory-list.css。
=========================================================== -->

<!-- 空間（ズームイン／アウトの対象）。写真はmemory-list.jsが描画する。 -->
<div class="memlist__world" id="memWorld">
  <div class="memlist__space" id="memSpace" aria-label="思い出の写真が散らばった空間">
    <div class="memlist__dim" id="memDim" aria-hidden="true"></div>
  </div>
</div>

<a class="memlist__back" href="index.html" id="memBack">
  <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 L3 7 L9 12" fill="none" stroke="#282828" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  MEMORYに戻る
</a>

<header class="memlist__head" id="memHead">
  <p class="memlist__eyebrow memlist-dela">MEMORY</p>
  <h1 class="memlist__title memlist-dela">もっと思い出を振り返る</h1>
</header>

<!-- 整理モード（カルーセル表示中）だけ使うUI -->
<div class="memlist__counter memlist-dela" id="memCounter" aria-live="polite"></div>
<button type="button" class="memlist__close" id="memClose" hidden>
  <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2 L12 12 M12 2 L2 12" stroke="#282828" stroke-width="2" stroke-linecap="round"/></svg>
  閉じる
</button>
<button type="button" class="memlist__nav memlist__nav--prev" id="memPrev" aria-label="前の写真" hidden>
  <svg width="16" height="16" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 L3 7 L9 12" fill="none" stroke="#282828" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
<button type="button" class="memlist__nav memlist__nav--next" id="memNext" aria-label="次の写真" hidden>
  <svg width="16" height="16" viewBox="0 0 14 14" aria-hidden="true"><path d="M5 2 L11 7 L5 12" fill="none" stroke="#282828" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>

<!-- 整理タブ（カテゴリー） -->
<nav class="memlist__tabs" id="memTabs" aria-label="写真のカテゴリー"></nav>

<!-- ズームイン／アウト時に画面を覆う暗幕（背景色と同じ#282828）。
     初回ペイントの時点で既に覆っておく必要があるので、inline styleで
     不透明にしておき、memory-list.jsがズームしながら消す。 -->
<div class="memlist__fade" id="memFade" style="opacity:1" aria-hidden="true"></div>

<script src="assets/js/page-transition.js"></script>
<script src="assets/js/memory-list-data.js"></script>
<script src="assets/js/memory-list.js"></script>
</body>
</html>
