<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時系列で見る | happy_wedding</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=M+PLUS+Rounded+1c:wght@400;700&family=Onest:wght@900&display=swap" rel="stylesheet">
</head>

<body id="top">
    <!-- 右上の丸いメニューボタン。トップページと同じもの -->
    <button class="menu_bt" type="button" aria-expanded="false">
        <img class="menu_bt_img" src="../img/menu_bt.svg" alt="">
    </button>

    <main class="time_page">
        <div class="time_page_inner">
            <!-- パンくず -->
            <nav class="breadcrumb">
                <a href="../index.html">TOP</a>
                <span>&gt;</span>
                <a href="../index.html#memory">MEMORY</a>
                <span>&gt;</span>
                <span class="current">時系列で見る</span>
            </nav>

            <div class="timeline">
                <!-- 中央を貫く破線。Gridで「1行目〜最終行」にまたがせているので、
                     写真の枚数が変わって全体の高さが変わっても自動で追従する -->
                <div class="timeline_line" aria-hidden="true"></div>

                <div class="timeline_year">2023<span class="dot"></span></div>
                <div class="timeline_photos">
                    <div class="timeline_photo"><img src="../img/photo/memory/memory_1.png" alt=""></div>
                    <div class="timeline_photo"><img src="../img/photo/memory/memory_2.png" alt=""></div>
                    <div class="timeline_photo"><img src="../img/photo/memory/memory_3.png" alt=""></div>
                    <div class="timeline_photo"><img src="../img/photo/memory/memory_4.png" alt=""></div>
                </div>

                <div class="timeline_year">2024<span class="dot"></span></div>
                <div class="timeline_photos">
                    <div class="timeline_photo"><img src="../img/photo/memory/memory_5.jpeg" alt=""></div>
                    <div class="timeline_photo"><img src="../img/photo/memory/memory_6.jpeg" alt=""></div>
                </div>

                <div class="timeline_year">2025<span class="dot"></span></div>
                <div class="timeline_photos">
                    <div class="timeline_photo"><img src="../img/photo/memory/memory_7.jpeg" alt=""></div>
                    <div class="timeline_photo"><img src="../img/photo/memory/memory_8.jpeg" alt=""></div>
                    <div class="timeline_photo"><img src="../img/photo/memory/memory_9.jpeg" alt=""></div>
                </div>

                <div class="timeline_year">2026<span class="dot"></span></div>
                <div class="timeline_photos">
                    <div class="timeline_photo"><img src="../img/photo/memory/memory_10.jpeg" alt=""></div>
                    <div class="timeline_photo"><img src="../img/photo/memory/memory_1.png" alt=""></div>
                </div>

                <div class="timeline_end">
                    <span class="timeline_end_text">つづく</span>
                    <span class="timeline_arrow" aria-hidden="true"></span>
                </div>
            </div>
        </div>
    </main>

    <!-- 右上の丸ボタンで開閉するモーダルメニュー。トップページと同じ構造 -->
    <nav class="modal_menu" id="modal_menu">
        <div class="modal_menu_panel">
            <button class="modal_menu_close" type="button"></button>
            <ul>
                <li><a href="../index.html#top">TOP</a></li>
                <li><a href="../index.html#about">ABOUT</a></li>
                <li><a href="../index.html#memory">MEMORY</a></li>
                <li><a href="../index.html#message">MESSAGE</a></li>
                <li><a href="../index.html#QandA">Q&amp;A</a></li>
                <li><a href="../index.html#fin">FIN</a></li>
            </ul>
        </div>
    </nav>

    <script src="../js/function.js"></script>

</body>

</html>
